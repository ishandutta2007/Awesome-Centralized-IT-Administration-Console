<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b176ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6930c3" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <style>
      .bg-pulse {
        animation: pulseOrb 8s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: flowAnimation 20s linear infinite;
      }
      .node-pulse {
        animation: pulseNode 3s ease-in-out infinite alternate;
      }
      .orbit-spin {
        transform-origin: 600px 210px;
        animation: spinOrbit 35s linear infinite;
      }
      @keyframes flowAnimation {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseOrb {
        0% { transform: scale(0.9); opacity: 0.25; }
        100% { transform: scale(1.15); opacity: 0.45; }
      }
      @keyframes pulseNode {
        0% { r: 5; opacity: 0.6; }
        100% { r: 8; opacity: 1; }
      }
      @keyframes spinOrbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Subtle Cybernetic Grid Pattern -->
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.8"/>

  <!-- Dynamic Animated Glowing Ambient Orbs (Strictly in Background) -->
  <g>
    <circle cx="200" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" class="bg-pulse" style="transform-origin: 200px 100px;"/>
    <circle cx="1000" cy="300" r="160" fill="#818cf8" filter="url(#glow)" class="bg-pulse" style="transform-origin: 1000px 300px; animation-delay: -4s;"/>
    <circle cx="600" cy="210" r="180" fill="#6366f1" filter="url(#glow)" opacity="0.15"/>
  </g>

  <!-- Dynamic Network Architecture Lines & Nodes (Central Console Motif) -->
  <g opacity="0.6">
    <!-- Center Console Ring Orbit -->
    <ellipse cx="600" cy="210" rx="460" ry="140" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>
    
    <!-- Flow Lines to Peripheral Nodes -->
    <path d="M 600 210 L 150 90" stroke="url(#cyberCyan)" stroke-width="1.5" class="dash-flow"/>
    <path d="M 600 210 L 1050 90" stroke="url(#neonPurple)" stroke-width="1.5" class="dash-flow"/>
    <path d="M 600 210 L 120 330" stroke="url(#neonPurple)" stroke-width="1.5" class="dash-flow"/>
    <path d="M 600 210 L 1080 330" stroke="url(#cyberCyan)" stroke-width="1.5" class="dash-flow"/>

    <!-- Peripheral Endpoint Nodes -->
    <!-- Node 1: Identity & SSO -->
    <g transform="translate(150, 90)">
      <circle r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle r="6" fill="#38bdf8" class="node-pulse" filter="url(#nodeGlow)"/>
      <text y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">IAM &amp; SSO</text>
    </g>

    <!-- Node 2: ITSM & Helpdesk -->
    <g transform="translate(1050, 90)">
      <circle r="22" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
      <circle r="6" fill="#818cf8" class="node-pulse" filter="url(#nodeGlow)" style="animation-delay: -1s;"/>
      <text y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">ITSM &amp; SERVICE DESK</text>
    </g>

    <!-- Node 3: CMDB & Asset -->
    <g transform="translate(120, 330)">
      <circle r="22" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
      <circle r="6" fill="#a855f7" class="node-pulse" filter="url(#nodeGlow)" style="animation-delay: -2s;"/>
      <text y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CMDB &amp; ITAM</text>
    </g>

    <!-- Node 4: Unified Control Plane -->
    <g transform="translate(1080, 330)">
      <circle r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle r="6" fill="#38bdf8" class="node-pulse" filter="url(#nodeGlow)" style="animation-delay: -1.5s;"/>
      <text y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AUDIT &amp; RBAC</text>
    </g>
  </g>

  <!-- High-Tech Central Frame Plate (Keeps Foreground Clean & Legible) -->
  <rect x="220" y="70" width="760" height="270" rx="20" fill="#0b1120" fill-opacity="0.88" stroke="#1e293b" stroke-width="2" filter="url(#glow)"/>
  <rect x="225" y="75" width="750" height="260" rx="16" fill="none" stroke="url(#titleGrad)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Top Decorative UI Console Bar -->
  <g transform="translate(240, 92)">
    <circle cx="8" cy="8" r="4.5" fill="#ef4444"/>
    <circle cx="24" cy="8" r="4.5" fill="#f59e0b"/>
    <circle cx="40" cy="8" r="4.5" fill="#10b981"/>
    <rect x="65" y="1" width="160" height="14" rx="4" fill="#1e293b" opacity="0.6"/>
    <text x="145" y="11" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">admin-console-v2.6</text>
  </g>

  <!-- FOREGROUND TEXT CONTENT (Pure Clarity, High Contrast) -->
  <!-- Top Category Pill -->
  <g transform="translate(600, 130)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <text y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">⚡ UNIFIED CONTROL PLANES</text>
  </g>

  <!-- Main Repository Title -->
  <text x="600" y="195" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" text-anchor="middle">
    Centralized IT Administration Console
  </text>

  <!-- Subtitle / Tagline -->
  <text x="600" y="235" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Curated SaaS Platforms, Enterprise Control Planes &amp; Open-Source ITSM Solutions
  </text>

  <!-- Feature Tags / Metric Badges inside Console Box -->
  <g transform="translate(600, 280)">
    <!-- Tag 1 -->
    <rect x="-240" y="-12" width="105" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="-187" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🛡️ RBAC &amp; IAM</text>

    <!-- Tag 2 -->
    <rect x="-120" y="-12" width="115" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="-62" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">📊 ITAM &amp; CMDB</text>

    <!-- Tag 3 -->
    <rect x="5" y="-12" width="115" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="62" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🎫 Service Desk</text>

    <!-- Tag 4 -->
    <rect x="130" y="-12" width="110" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="185" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🚀 Open Source</text>
  </g>

</svg>
